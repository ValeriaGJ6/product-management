<div class="product-list-container">
    <mat-card class="product-card">
        <mat-card-header>
            <mat-card-subtitle>Manage your product catalog</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <div class="action-buttons">
                <button mat-raised-button color="primary" [routerLink]="['/products/create']">
                    <mat-icon>add</mat-icon>
                    New Product
                </button>
            </div>

            <div class="table-container">
                @if (isLoading()) {
                    <div class="loading-container">
                        <mat-spinner diameter="50"></mat-spinner>
                        <p>Loading products...</p>
                    </div>
                } @else {
                    <table mat-table [dataSource]="products()" matSort class="product-table">
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                            <td mat-cell *matCellDef="let product" class="product-name">{{product.name}}</td>
                        </ng-container>

                        <ng-container matColumnDef="description">
                            <th mat-header-cell *matHeaderCellDef>Description</th>
                            <td mat-cell *matCellDef="let product" class="product-description">{{product.description}}</td>
                        </ng-container>

                        <ng-container matColumnDef="price">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
                            <td mat-cell *matCellDef="let product" class="product-price">
                                {{product.price | currency:'COP':'symbol':'1.0-2':'es-CO'}}
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="createdAt">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
                            <td mat-cell *matCellDef="let product">{{product.createdAt | date:'short'}}</td>
                        </ng-container>

                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef>Actions</th>
                            <td mat-cell *matCellDef="let product" class="action-buttons-cell">
                                <button mat-icon-button color="primary" [routerLink]="['/products/edit', product.id]"
                                    matTooltip="Edit product">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" (click)="deleteProduct(product)"
                                    matTooltip="Delete product">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                }
            </div>

            <mat-paginator 
                [length]="totalCount()"
                [pageSize]="pageSize()"
                [pageIndex]="currentPage() - 1"
                [pageSizeOptions]="[5, 10, 20]" 
                (page)="onPageChange($event)"
                showFirstLastButtons 
                aria-label="Select page of products">
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</div>
